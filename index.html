<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6v3 Rondo with Transition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a; font-family: 'Barlow', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; color: #fff;
  }

  .header { text-align: center; margin-bottom: 14px; }
  .header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px;
    letter-spacing: 2px; text-transform: uppercase; color: #C61D23;
  }
  .header p { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  .phase-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #fff; background: #C61D23;
    padding: 4px 16px; margin-bottom: 12px; min-width: 290px; text-align: center;
  }

  .scene { position: relative; width: 360px; height: 530px; }

  .field {
    position: absolute; top: 40px; left: 50px; width: 260px; height: 420px;
    background: #1a5c1a; border: 2px solid rgba(255,255,255,0.7); border-radius: 2px;
  }
  .field::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, transparent, transparent 42px,
      rgba(255,255,255,0.04) 42px, rgba(255,255,255,0.04) 84px);
  }
  /* Zone divider lines (1/3 and 2/3 down the field) */
  .zone-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.45); }
  .zone-line.top    { top: 33.33%; }
  .zone-line.bottom { top: 66.66%; }

  .penalty-top, .penalty-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 116px; height: 42px; border: 1px solid rgba(255,255,255,0.28);
  }
  .penalty-top    { top: 0;    border-top: none; }
  .penalty-bottom { bottom: 0; border-bottom: none; }
  .goal-top, .goal-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 64px; height: 10px; border: 2px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.07);
  }
  .goal-top    { top: -10px;    border-bottom: none; }
  .goal-bottom { bottom: -10px; border-top: none; }

  /* Coach token on right sideline */
  .coach {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #222; border: 1.5px solid #888; color: #ccc;
    font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }

  /* ── Players ── */
  .player {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1), top 0.85s cubic-bezier(0.4,0,0.2,1);
    z-index: 10;
  }
  .player.gk {
    border-radius: 5px; font-size: 9px; border-color: rgba(255,255,255,0.75);
    transition: none;
    background: #d4a017; color: #1a1a1a; box-shadow: 0 0 8px rgba(212,160,23,0.55);
  }
  .player.red    { background: #C61D23; box-shadow: 0 0 8px rgba(198,29,35,0.5); }
  .player.blue   { background: #1a6eb5; box-shadow: 0 0 8px rgba(26,110,181,0.5); }
  .player.green  { background: #2da53b; box-shadow: 0 0 8px rgba(45,165,59,0.55); }

  .player.pulse { animation: pulse 0.45s ease-in-out 4; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.6)} }

  /* Ball */
  .ball {
    position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 1px solid #bbb; z-index: 20;
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1), top 0.85s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 8px rgba(255,255,255,0.9);
  }

  /* Pass-count / intercept flash chip */
  .pass-flash {
    position: absolute;
    top: 8px; right: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 900;
    color: #fff; background: #C61D23;
    padding: 4px 10px; letter-spacing: 1.5px;
    border-radius: 2px;
    opacity: 0; transform: scale(0.6);
    transition: opacity 0.15s ease-out, transform 0.2s ease-out;
    z-index: 28; pointer-events: none; white-space: nowrap;
    box-shadow: 0 0 12px rgba(198,29,35,0.45);
  }
  .pass-flash.show { opacity: 1; transform: scale(1); }
  .pass-flash.intercept {
    background: #1a6eb5;
    box-shadow: 0 0 14px rgba(26,110,181,0.55);
    font-size: 14px;
  }

  /* Goal flash */
  .goal-flash {
    position: absolute; top: 40px; left: 50px; width: 260px; height: 420px;
    background: rgba(198,29,35,0.12); border: 2px solid #C61D23;
    pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; border-radius: 2px;
  }
  .goal-flash.show { opacity: 1; }

  .goal-text {
    position: absolute; top: 47%; left: 50%; transform: translate(-50%,-50%);
    font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900;
    color: #C61D23; letter-spacing: 4px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.3s; z-index: 30;
    text-shadow: 0 0 24px rgba(198,29,35,0.9); pointer-events: none; white-space: nowrap;
  }
  .goal-text.show { opacity: 1; }

  /* Arrow layer (dynamic) */
  .arrows-svg {
    position: absolute; top: 0; left: 0; width: 360px; height: 530px;
    pointer-events: none; z-index: 15;
  }

  /* Legend */
  .legend { display: flex; gap: 14px; margin-top: 10px; justify-content: center; flex-wrap: wrap; max-width: 360px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #bbb;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.red    { background: #C61D23; }
  .legend-dot.blue   { background: #1a6eb5; }
  .legend-dot.green  { background: #2da53b; }
  .legend-dot.gk     { background: #d4a017; border-radius: 3px; }

  .step-indicators { display: flex; gap: 7px; margin-top: 10px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.3s; }
  .step-dot.active { background: #C61D23; }
  .step-dot.done   { background: #555; }

  .desc {
    font-size: 11px; color: #777; text-align: center; max-width: 320px;
    margin-top: 6px; line-height: 1.5; min-height: 32px;
  }

  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 18px;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary            { background: #C61D23; color: #fff; }
  .btn-primary:hover      { background: #e02228; }
  .btn-secondary          { background: transparent; color: #888; border: 1px solid #333; }
  .btn-secondary:hover    { border-color: #666; color: #ccc; }

  /* TSI Logo */
  .tsi-logo-wrap{display:flex;justify-content:center;padding:0 0 12px;width:100%;}
  .tsi-logo{height:38px;width:auto;display:block;}
</style>
</head>

<div class="header">
  <h1>6v3 Rondo with Transition</h1>
  <p>To Goals</p>
</div>

<div class="phase-label" id="phaseLabel">Set Up</div>

<div class="scene">
  <div class="field">
    <div class="zone-line top"></div>
    <div class="zone-line bottom"></div>
    <div class="penalty-top"></div>
    <div class="penalty-bottom"></div>
    <div class="goal-top"></div>
    <div class="goal-bottom"></div>
  </div>

  <div class="goal-flash" id="goalFlash"></div>
  <div class="goal-text"  id="goalText">GOAL!</div>
  <div class="pass-flash" id="passFlash"></div>

  <svg class="arrows-svg" id="arrowsSvg" viewBox="0 0 360 530">
    <defs>
      <marker id="mRed"   markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C61D23"/></marker>
      <marker id="mBlue"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a6eb5"/></marker>
      <marker id="mGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2da53b"/></marker>
      <marker id="mPass"  markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ffffff"/></marker>
    </defs>
    <g id="arrowGroup"></g>
  </svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot red"></div>Red — attack top goal</div>
  <div class="legend-item"><div class="legend-dot blue"></div>Blue — defenders</div>
  <div class="legend-item"><div class="legend-dot green"></div>Green — attack bottom goal</div>
  <div class="legend-item"><div class="legend-dot gk"></div>GK — neutral</div>
</div>

<div class="step-indicators" id="stepDots"></div>
<div class="desc" id="desc"></div>

<div class="controls">
  <button class="btn btn-secondary" id="prevBtn" onclick="changePhase(-1)">← Back</button>
  <button class="btn btn-primary"   id="playBtn" onclick="toggleAuto()">▶ Auto</button>
  <button class="btn btn-secondary" id="nextBtn" onclick="changePhase(1)">Next →</button>
</div>

<script>
// ── Geometry ─────────────────────────────────────────────────────────
const FL=50, FT=40, FW=260, FH=420;
function p(px,py){ return [ FL + px/100*FW - 12,  FT + py/100*FH - 12 ]; }
function b(px,py){ return [ FL + px/100*FW - 6.5, FT + py/100*FH - 6.5 ]; }
function ctr(pos){ return [ pos[0]+12, pos[1]+12 ]; }
function bctr(pos){ return [ pos[0]+6.5, pos[1]+6.5 ]; }

// ── Fixed neutral GKs ────────────────────────────────────────────────
const TOP_GK = p(50, 3);    // top goal GK
const BOT_GK = p(50, 97);   // bottom goal GK

// Coach position (off-pitch right sideline, middle of field vertically)
const COACH_POS = [332, 240];      // scene coords for coach token
const COACH_BALL = [332+11-6.5, 240+11-6.5]; // ball at coach

// ── Team set positions (2 rows of 3 in each zone) ────────────────────
const R_SET = [ p(22,11), p(50,11), p(78,11),
                p(22,27), p(50,27), p(78,27) ];

const B_SET = [ p(22,40), p(50,40), p(78,40),
                p(22,58), p(50,58), p(78,58) ];

const G_SET = [ p(22,72), p(50,72), p(78,72),
                p(22,89), p(50,89), p(78,89) ];

// ── Phase-specific shapes ────────────────────────────────────────────
// Phase 2: Red in play (scrambled in red zone)
const R_PLAY = [ p(18,18), p(45,8),  p(75,15),
                 p(30,28), p(58,22), p(80,28) ];

// Phase 2: blue indices 0,1,2 push into red zone (defenders).
// blue 3,4,5 stay middle (drop slightly to y=55).
const B_DEF_RED = [ p(30,30), p(50,30), p(70,30),
                    p(22,55), p(50,55), p(78,55) ];

// Phase 4: blue 0,1,2 (were in red zone) retreat to middle (y=50).
// blue 3,4,5 (were middle bottom) push down into green zone (y=72).
const B_DEF_GREEN = [ p(22,50), p(50,50), p(78,50),
                      p(30,72), p(50,72), p(70,72) ];

// Phase 5: Green in play (scrambled in green zone)
const G_PLAY = [ p(20,78), p(50,90), p(75,80),
                 p(30,95), p(58,72), p(80,93) ];

// Phase 6: all 6 blues now in green zone (new attackers)
const B_ALL_GREEN = [ p(22,72), p(50,72), p(78,72),
                      p(22,89), p(50,89), p(78,89) ];

// Phase 6: 3 greens to red zone (defenders), 3 greens to middle
const G_DEF_RED = [ p(30,30), p(50,30), p(70,30),
                    p(22,55), p(50,55), p(78,55) ];

// ── Phases ────────────────────────────────────────────────────────────
const phases = [
  {
    label:"Set Up",
    desc:"Three teams of 6 in their zones. Reds top, Blues middle, Greens bottom. Neutral GKs in each goal. Ball with the coach.",
    showGoal:false,
    red:R_SET, blue:B_SET, green:G_SET,
    ball: COACH_BALL,
    arrows: []
  },
  {
    label:"Coach Plays Into Red",
    desc:"Coach plays the ball into Red. 3 Blues push up out of the middle to press in the Red zone. Other 3 Blues hold the middle.",
    showGoal:false,
    red:R_PLAY, blue:B_DEF_RED, green:G_SET,
    ball: b(72, 18),
    arrows: [
      // 3 blue defenders pushing into red zone (from B_SET top row → B_DEF_RED first 3)
      { from: ctr(B_SET[0]), to: ctr(B_DEF_RED[0]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_SET[1]), to: ctr(B_DEF_RED[1]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_SET[2]), to: ctr(B_DEF_RED[2]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      // Coach → Red zone (entry pass)
      { from: COACH_POS, to: bctr(b(72,18)), color:'#ffffff', dashed:false, marker:'mPass' }
    ]
  },
  {
    label:"Red Score",
    desc:"Red string together 7 passes with the 3 Blue defenders chasing but not winning it, then finish on the top goal.",
    showGoal:true, goalPulse:'red',
    red:R_PLAY,
    blue:[ p(28,18), p(48,16), p(65,15), p(22,55), p(50,55), p(78,55) ],
    green:G_SET,
    ball: b(50, 0),
    arrows: [
      // shot from shooter (R_PLAY[1] at p(45,8)) → top goal mouth
      { from: ctr(R_PLAY[1]), to: bctr(b(50,0)), color:'#ffffff', dashed:false, marker:'mPass' }
    ],
    // Blue chasers: blue[0]=left, blue[1]=middle, blue[2]=right. Nearest one presses ball.
    subSteps: [
      // pass 1: R[2] → R[0]. Ball arriving on right; blue[2] presses.
      { ball: b(75,15), flash:'1',
        blue:[ p(25,22), p(50,20), p(70,18), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[2]),to:ctr(R_PLAY[0]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 2: R[0] → R[3]. Ball on left; blue[0] presses.
      { ball: b(18,18), flash:'2',
        blue:[ p(25,18), p(45,22), p(68,22), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[0]),to:ctr(R_PLAY[3]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 3: R[3] → R[5]. Ball lower-left; blue[0] presses.
      { ball: b(30,28), flash:'3',
        blue:[ p(32,25), p(52,25), p(72,22), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[3]),to:ctr(R_PLAY[5]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 4: R[5] → R[4]. Ball lower-right; blue[2] presses.
      { ball: b(80,28), flash:'4',
        blue:[ p(25,25), p(52,22), p(72,25), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[5]),to:ctr(R_PLAY[4]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 5: R[4] → R[2]. Ball middle; blue[1] presses.
      { ball: b(58,22), flash:'5',
        blue:[ p(25,22), p(52,20), p(72,20), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[4]),to:ctr(R_PLAY[2]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 6: R[2] → R[3]. Ball right again; blue[2] presses.
      { ball: b(75,15), flash:'6',
        blue:[ p(25,22), p(48,22), p(70,18), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[2]),to:ctr(R_PLAY[3]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 7: R[3] → R[1] (shooter). Ball lower-left; blue[0] presses.
      { ball: b(30,28), flash:'7',
        blue:[ p(32,25), p(50,22), p(70,20), p(22,55), p(50,55), p(78,55) ],
        arrows:[{from:ctr(R_PLAY[3]),to:ctr(R_PLAY[1]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // ball arrives at shooter R[1]=p(45,8); blue[1] closest, presses.
      { ball: b(45,8),
        blue:[ p(28,18), p(48,16), p(65,15), p(22,55), p(50,55), p(78,55) ],
        arrows:[] }
    ]
  },
  {
    label:"Switch to Green",
    desc:"Coach plays into Green. The other 3 Blues drop down to press in the Green zone. The original 3 defenders retreat to the middle.",
    showGoal:false,
    red:R_SET, blue:B_DEF_GREEN, green:G_SET,
    ball: b(72, 78),
    arrows: [
      // 3 blues retreat from red zone → middle
      { from: ctr(B_DEF_RED[0]), to: ctr(B_DEF_GREEN[0]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_RED[1]), to: ctr(B_DEF_GREEN[1]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_RED[2]), to: ctr(B_DEF_GREEN[2]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      // 3 blues push from middle bottom → green zone
      { from: ctr(B_DEF_RED[3]), to: ctr(B_DEF_GREEN[3]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_RED[4]), to: ctr(B_DEF_GREEN[4]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_RED[5]), to: ctr(B_DEF_GREEN[5]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      // Coach → Green zone
      { from: COACH_POS, to: bctr(b(72,78)), color:'#ffffff', dashed:false, marker:'mPass' }
    ]
  },
  {
    label:"Blue Intercept & Score",
    desc:"Green get 4 passes away with Blue chasing. Blue cuts out the 5th pass and shoots immediately on the bottom goal.",
    showGoal:true, goalPulse:'blue',
    red:R_SET,
    blue:[ p(22,50), p(50,50), p(78,50), p(32,80), p(60,85), p(72,80) ],
    green:G_PLAY,
    ball: b(50, 100),
    arrows: [
      // shot from blue interceptor at p(60,85) → bottom goal
      { from: ctr(p(60,85)), to: bctr(b(50,100)), color:'#ffffff', dashed:false, marker:'mPass' }
    ],
    // Blue chasers in green zone: blue[3]=left, blue[4]=middle, blue[5]=right. Nearest presses.
    subSteps: [
      // pass 1: G[4] → G[0]. Ball top-middle of green zone; blue[4] presses.
      { ball: b(58,72), flash:'1',
        blue:[ p(22,50), p(50,50), p(78,50), p(28,78), p(52,75), p(78,78) ],
        arrows:[{from:ctr(G_PLAY[4]),to:ctr(G_PLAY[0]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 2: G[0] → G[3]. Ball top-left; blue[3] presses.
      { ball: b(20,78), flash:'2',
        blue:[ p(22,50), p(50,50), p(78,50), p(28,76), p(50,80), p(72,82) ],
        arrows:[{from:ctr(G_PLAY[0]),to:ctr(G_PLAY[3]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 3: G[3] → G[5]. Ball lower-left; blue[3] presses.
      { ball: b(30,95), flash:'3',
        blue:[ p(22,50), p(50,50), p(78,50), p(32,90), p(55,88), p(75,85) ],
        arrows:[{from:ctr(G_PLAY[3]),to:ctr(G_PLAY[5]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // pass 4: G[5] → G[2]. Ball lower-right; blue[5] presses.
      { ball: b(80,93), flash:'4',
        blue:[ p(22,50), p(50,50), p(78,50), p(35,82), p(58,88), p(72,88) ],
        arrows:[{from:ctr(G_PLAY[5]),to:ctr(G_PLAY[2]),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // attempted pass 5: G[2] → G[1]. Blue[4] reads play, steps into lane at p(60,85). blue[5] still pressing G[2].
      { ball: b(75,80),
        blue:[ p(22,50), p(50,50), p(78,50), p(32,80), p(60,85), p(72,80) ],
        arrows:[{from:ctr(G_PLAY[2]),to:ctr(p(60,85)),color:'#ffffff',dashed:false,marker:'mPass'}] },
      // ball arrives at blue[4] — INTERCEPT
      { ball: b(60,85), flash:'INTERCEPT', intercept:true,
        blue:[ p(22,50), p(50,50), p(78,50), p(32,80), p(60,85), p(72,80) ],
        arrows:[] }
    ]
  },
  {
    label:"Full Rotation",
    desc:"All 6 Blues become the new attackers in the Green zone. Greens send 3 up to press the Red zone, 3 drop into the middle. Coach restarts into Red.",
    showGoal:false,
    red:R_SET, blue:B_ALL_GREEN, green:G_DEF_RED,
    ball: b(72, 18),
    arrows: [
      // Blue full team move into green zone (from B_DEF_GREEN → B_ALL_GREEN)
      { from: ctr(B_DEF_GREEN[0]), to: ctr(B_ALL_GREEN[0]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_GREEN[1]), to: ctr(B_ALL_GREEN[1]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      { from: ctr(B_DEF_GREEN[2]), to: ctr(B_ALL_GREEN[2]), color:'#1a6eb5', dashed:true, marker:'mBlue' },
      // Greens 0,1,2 up to red zone (from G_SET first row → G_DEF_RED first 3)
      { from: ctr(G_SET[0]), to: ctr(G_DEF_RED[0]), color:'#2da53b', dashed:true, marker:'mGreen' },
      { from: ctr(G_SET[1]), to: ctr(G_DEF_RED[1]), color:'#2da53b', dashed:true, marker:'mGreen' },
      { from: ctr(G_SET[2]), to: ctr(G_DEF_RED[2]), color:'#2da53b', dashed:true, marker:'mGreen' },
      // Greens 3,4,5 to middle (from G_SET bottom row → G_DEF_RED last 3)
      { from: ctr(G_SET[3]), to: ctr(G_DEF_RED[3]), color:'#2da53b', dashed:true, marker:'mGreen' },
      { from: ctr(G_SET[4]), to: ctr(G_DEF_RED[4]), color:'#2da53b', dashed:true, marker:'mGreen' },
      { from: ctr(G_SET[5]), to: ctr(G_DEF_RED[5]), color:'#2da53b', dashed:true, marker:'mGreen' },
      // Coach → Red zone (restart pass)
      { from: COACH_POS, to: bctr(b(72,18)), color:'#ffffff', dashed:false, marker:'mPass' }

// ── Build players ────────────────────────────────────────────────────
const scene = document.querySelector('.scene');
const els = { red:[], blue:[], green:[], topGK:null, botGK:null, ball:null, coach:null };

function mkPlayer(team, label, isGK){
  const el = document.createElement('div');
  el.className = `player ${team}${isGK?' gk':''}`;
  el.textContent = label;
  scene.appendChild(el);
  return el;
}

function createAll(){
  // Neutral GKs (yellow, placed once)
  els.topGK = mkPlayer('','GK',true);
  els.botGK = mkPlayer('','GK',true);
  els.topGK.style.left = TOP_GK[0]+'px'; els.topGK.style.top = TOP_GK[1]+'px';
  els.botGK.style.left = BOT_GK[0]+'px'; els.botGK.style.top = BOT_GK[1]+'px';

  // 6 outfielders per team, numbered 1-6
  ['red','blue','green'].forEach(team=>{
    for(let i=1;i<=6;i++){
      els[team].push(mkPlayer(team, String(i), false));
    }
  });

  // Coach token (fixed on right sideline)
  const coach = document.createElement('div');
  coach.className = 'coach';
  coach.textContent = 'C';
  coach.style.left = COACH_POS[0]-11+'px';
  coach.style.top  = COACH_POS[1]-11+'px';
  scene.appendChild(coach);
  els.coach = coach;

  // Ball
  const ball = document.createElement('div');
  ball.className = 'ball';
  scene.appendChild(ball);
  els.ball = ball;
}

// ── Render arrows for a phase ────────────────────────────────────────
function renderArrows(arrows){
  const g = document.getElementById('arrowGroup');
  g.innerHTML = '';
  arrows.forEach(a=>{
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${a.from[0]},${a.from[1]} L${a.to[0]},${a.to[1]}`);
    path.setAttribute('stroke', a.color);
    path.setAttribute('stroke-width', a.dashed ? '1.8' : '2.2');
    path.setAttribute('fill', 'none');
    if(a.dashed) path.setAttribute('stroke-dasharray','5,3');
    path.setAttribute('marker-end', `url(#${a.marker})`);
    path.setAttribute('opacity', a.dashed ? '0.9' : '0.9');
    g.appendChild(path);
  });
}

// ── Render phase ─────────────────────────────────────────────────────
let current=0, isAuto=false;
let subTimer=null, autoTimer=null;
const SUB_STEP_MS = 900;
const SETTLE_MS   = 1600;
const NORMAL_MS   = 2400;

function clearTimers(){
  if(subTimer){ clearTimeout(subTimer); subTimer=null; }
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }
}

let flashHideTimer = null;
function showFlash(text, intercept){
  const f = document.getElementById('passFlash');
  if(!text){ f.classList.remove('show'); return; }
  f.textContent = text;
  f.classList.toggle('intercept', !!intercept);
  f.classList.add('show');
  if(flashHideTimer) clearTimeout(flashHideTimer);
  flashHideTimer = setTimeout(()=>{ f.classList.remove('show'); }, SUB_STEP_MS - 80);
}
function hideFlash(){
  document.getElementById('passFlash').classList.remove('show');
  if(flashHideTimer){ clearTimeout(flashHideTimer); flashHideTimer=null; }
}

function renderState(state, showGoal){
  ['red','blue','green'].forEach(team=>{
    els[team].forEach((el,i)=>{
      el.style.left = state[team][i][0]+'px';
      el.style.top  = state[team][i][1]+'px';
    });
  });
  els.ball.style.left = state.ball[0]+'px';
  els.ball.style.top  = state.ball[1]+'px';

  document.getElementById('goalFlash').classList.toggle('show', !!showGoal);
  document.getElementById('goalText').classList.toggle('show', !!showGoal);

  renderArrows(state.arrows || []);
}

function applyPhase(idx){
  clearTimers();
  hideFlash();
  const ph = phases[idx];

  document.getElementById('phaseLabel').textContent = ph.label;
  document.getElementById('desc').textContent = ph.desc;
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===phases.length-1 ? '0.3':'1';

  const hasSubs = ph.subSteps && ph.subSteps.length;
  if(!hasSubs){
    renderState(ph, ph.showGoal);
    if(ph.showGoal && ph.goalPulse){
      els[ph.goalPulse].forEach(el=>{
        el.classList.add('pulse');
        setTimeout(()=>el.classList.remove('pulse'),1800);
      });
    }
    if(isAuto && idx<phases.length-1){
      autoTimer = setTimeout(()=>{ current++; applyPhase(current); }, NORMAL_MS);
    }
    return;
  }

  // Sub-step playback
  let s = 0;
  const playSub = () => {
    if(s < ph.subSteps.length){
      const sub = ph.subSteps[s];
      const merged = {
        red:   sub.red   || ph.red,
        blue:  sub.blue  || ph.blue,
        green: sub.green || ph.green,
        ball:  sub.ball  || ph.ball,
        arrows: sub.arrows ?? ph.arrows
      };
      renderState(merged, false);
      if(sub.flash) showFlash(sub.flash, sub.intercept); else hideFlash();
      s++;
      subTimer = setTimeout(playSub, SUB_STEP_MS);
    } else {
      // Final phase state (the goal)
      hideFlash();
      renderState(ph, ph.showGoal);
      if(ph.showGoal && ph.goalPulse){
        els[ph.goalPulse].forEach(el=>{
          el.classList.add('pulse');
          setTimeout(()=>el.classList.remove('pulse'),1800);
        });
      }
      if(isAuto && idx<phases.length-1){
        autoTimer = setTimeout(()=>{ current++; applyPhase(current); }, SETTLE_MS);
      }
    }
  };
  playSub();
}

function changePhase(dir){
  const next = Math.max(0, Math.min(phases.length-1, current+dir));
  if(next!==current){ current=next; applyPhase(current); }
  else if(current===phases.length-1 && isAuto) stopAuto();
}

function toggleAuto(){
  if(isAuto){ stopAuto(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===phases.length-1){ current=0; }
  applyPhase(current);
}

function stopAuto(){
  isAuto=false;
  clearTimers();
  document.getElementById('playBtn').textContent='▶ Auto';
}

// ── Init ─────────────────────────────────────────────────────────────
phases.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='step-dot';
  document.getElementById('stepDots').appendChild(d);
});

createAll();
applyPhase(0);
</script>
