<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6v3 Rondo with Transition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a; font-family: 'Barlow', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; color: #fff;
  }

  .header { text-align: center; margin-bottom: 10px; }
  .header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px;
    letter-spacing: 2px; text-transform: uppercase; color: #C61D23;
  }

  .phase-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #fff; background: #C61D23;
    padding: 4px 16px; margin-bottom: 12px; min-width: 290px; text-align: center;
  }

  .scene { position: relative; width: 360px; height: 400px; overflow: hidden; }
  .scene svg { position: absolute; inset: 0; display: block; }

  /* Pass counter — 8 pips, split passes gold, all green when the target is reached */
  .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: 'Barlow Condensed', sans-serif; }
  .score-lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #555; transition: color 0.3s; }
  .pips { display: flex; gap: 3px; }
  .pip { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #222; background: #111;
         transition: background 0.35s, border-color 0.35s; display: flex; align-items: center; justify-content: center;
         font-size: 9px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; color: #333; }
  .pip.on    { background: #C61D23; border-color: #C61D23; color: #fff; }
  .pip.split { background: #f0a500; border-color: #f0a500; color: #fff; }
  .pip.win   { background: #22b56e; border-color: #22b56e; color: #fff; }

  /* Pass / beat badge, bottom-left */
  .badge {
    position: absolute; left: 10px; bottom: 10px; z-index: 30; padding: 3px 9px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 1.5px; text-transform: uppercase; color: #fff;
    background: rgba(10,10,10,0.8); pointer-events: none;
  }

  /* Two grids: the one in play is lit, the waiting one dimmed (as on the 2D board) */
  .gfill { transition: opacity 0.5s; }
  .gline { transition: stroke 0.4s, opacity 0.5s; }
  .gdim  { opacity: 0.35; }
  .glbl {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; text-anchor: middle; fill: #383838; transition: fill 0.4s;
  }
  .glbl.active { fill: #9a9a9a; }
  .gline.win { stroke: #22b56e; }
  .gline.int { stroke: #C61D23; }
  .gline.split { stroke: #f0a500; }
  /* TARGET! / INTERCEPT! / 1 v 1 call-outs */
  .ftxt { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px;
          text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 4px; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
  .ftxt.small { font-size: 17px; }
  .ftxt.show { opacity: 1; }
  /* Session note on the open grass above the grids */
  .note {
    position: absolute; left: 16px; right: 16px; top: 10px; text-align: center; pointer-events: none;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; line-height: 1.5; letter-spacing: .7px;
    text-transform: uppercase; color: #aecaae;
  }
  /* Pass trail on the grass: latest pass bright, earlier passes faded */
  #trail g { transition: opacity 0.4s; }
  /* Side letters above the attackers' heads */
  #tags text {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px;
    text-anchor: middle; fill: rgba(255,255,255,0.8); paint-order: stroke; stroke: rgba(0,0,0,0.6); stroke-width: 3px;
  }

  /* Legend */
  .legend { display: flex; gap: 14px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #bbb;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.red  { background: #C61D23; }
  .legend-dot.blue { background: #1a6eb5; }
  .legend-dot.gk { background: #d9b100; border-radius: 2px; }
  .legend-dot.green { background: #ff8c1a; }
  .legend-dot.coach { background: #8d939c; }
  #splitTint { opacity: 0; transition: opacity 0.28s; }
  #splitTint.show { opacity: 1; }
  .legend-dot.gold { background: #f0a500; border-radius: 2px; }

  .step-indicators { display: flex; gap: 5px; margin-top: 10px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.3s; }
  .step-dot.active { background: #C61D23; }
  .step-dot.done   { background: #555; }

  .desc {
    font-size: 11px; color: #777; text-align: center; max-width: 330px;
    margin-top: 6px; line-height: 1.5; min-height: 32px;
  }

  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 18px;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary            { background: #C61D23; color: #fff; }
  .btn-primary:hover      { background: #e02228; }
  .btn-secondary          { background: transparent; color: #888; border: 1px solid #333; }
  .btn-secondary:hover    { border-color: #666; color: #ccc; }

  /* TSI Logo */
  .tsi-logo-wrap{display:flex;justify-content:center;padding:0 0 12px;width:100%;}
  .tsi-logo{height:38px;width:auto;display:block;}
</style>
</head>

<script>
/*@@ENGINE*/
// ╔══════════════════════════════════════════════════════════════════╗
// ║  TSI 3D ENGINE — shared by every 3D game animation               ║
// ║  Master copy: tools/engine-3d.js. Do not edit inside an output   ║
// ║  file — edit here, then run tools/splice-engine.jxa.             ║
// ╚══════════════════════════════════════════════════════════════════╝
// The drill script (after this block) must define:
//   cam    = lookCam({...})                       the camera
//   W(p)   board px [x,y] → world [x, z] metres
//   PH     phases: { pl:[[x,y]…], passer, … }      passer = index of the player on the ball
//   DRILL  { teams:['red',…], roles:['att'|'def'|'gk',…],
//            oneTouch:bool  (short non-split passes played first time),
//            flow:bool      (Auto: next pass starts straight off the touch, runs carry on),
//            centre:idx=>[x,z] (optional; the grid the ball is in, default [0,0]) }
// World: x right, y up, z away from the camera (metres). Ground is y = 0.
const PI = Math.PI, TAU = PI*2, SVGNS = 'http://www.w3.org/2000/svg';
const add3  = (a,b)=>[a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const sc3   = (a,s)=>[a[0]*s, a[1]*s, a[2]*s];
const lerp3 = (a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const sstep = (a,b,x)=>{ const k=Math.min(1, Math.max(0, (x-a)/(b-a))); return k*k*(3-2*k); };
const mix   = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=>Math.max(a, Math.min(b, v));
const wrap  = a=>Math.atan2(Math.sin(a), Math.cos(a));
const ease  = k=>k*k*(3-2*k);
const frac  = x=>x-Math.floor(x);
const mixQ  = (a,b,k)=>a.map((v,i)=>mix(v, b[i], k));
const unit  = v=>{ const n=Math.hypot(v[0],v[1])||1; return [v[0]/n, v[1]/n]; };
const dist  = (a,b)=>Math.hypot(a[0]-b[0], a[1]-b[1]);
const lerp2 = (a,b,k)=>[mix(a[0],b[0],k), mix(a[1],b[1],k)];

// ── Camera: turned by `yaw` (0 = looking along +z), tilted down by `pitch` ──
function toCam(cam, P){
  const dx=P[0]-cam.pos[0], ry=P[1]-cam.pos[1], dz=P[2]-cam.pos[2];
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const rx=dx*cy - dz*sy, rz=dx*sy + dz*cy;
  return [ rx, ry*cp + rz*sp, -ry*sp + rz*cp ];
}
const toScreen = (cam, c)=>[ cam.cx + cam.f*c[0]/c[2], cam.cy - cam.f*c[1]/c[2], c[2] ];
const project  = (cam, P)=>toScreen(cam, toCam(cam, P));
function lookCam(O){
  const d=[O.look[0]-O.pos[0], O.look[1]-O.pos[1], O.look[2]-O.pos[2]];
  return { pos:O.pos, yaw:Math.atan2(d[0],d[2]), pitch:Math.atan2(-d[1], Math.hypot(d[0],d[2])), f:O.f, cx:O.cx||180, cy:O.cy };
}

// ── Figure rig — body frame: x = figure's right, y = up, z = forward ──
const B = { LT:.44, LS:.44, ANK:.07, HIP:.1, TOR:.5, SHW:.19, LU:.28, LF:.26, NECK:.17, FOOT:.17 };
const TEAM = { red:'#C61D23', blue:'#1a6eb5', orange:'#b86d00', green:'#2e8b3e', yellow:'#d9b100', white:'#e8e8e8' };
const SKIN='#cfd3d6', SHORTS='#141414', BOOT='#0d0d0d', HAIR='#2b2018';
// Pose = flat array: lift, lean, roll, legL[a,b,g], legR[a,b,g], armL[a,b,e], armR[a,b,e], toe[L,R], anchor, neck
const Q = (lift,lean,roll,l0,l1,a0,a1,toe,anchor,neck)=>
  [lift,lean,roll,...l0,...l1,...a0,...a1, ...(Array.isArray(toe) ? toe : [toe||0, toe||0]), anchor||0, neck||0];

function legIK(z, y){
  const L=B.LT, r=Math.min(Math.hypot(z,y), 2*L-1e-4), al=Math.acos(r/(2*L));
  return [Math.atan2(z,y)+al, 2*al];
}

// Forward kinematics → joint positions in the body frame (lowest foot sits on the ground)
function fk(q){
  const lift=q[0], lean=q[1], roll=q[2];
  const leg = i=>({ a:q[3+i*3], b:q[4+i*3], g:q[5+i*3] });
  const arm = i=>({ a:q[9+i*3], b:q[10+i*3], e:q[11+i*3] });
  const drop = L=>(B.LT*Math.cos(L.a) + B.LS*Math.cos(L.a-L.b))*Math.cos(L.g);
  const tp = i=>q[15+i]||0, ankH = i=>Math.max(B.ANK, .03+Math.sin(tp(i))*B.FOOT);
  const py = Math.max(drop(leg(0))+ankH(0), drop(leg(1))+ankH(1)) + lift;
  const J = { pelvis:[0,py,0] };
  [0,1].forEach(i=>{
    const s=i?1:-1, L=leg(i), cg=Math.cos(L.g), sg=Math.sin(L.g), sp=L.a-L.b;
    const hip  = [s*B.HIP, py, 0];
    const knee = add3(hip,  [s*sg*B.LT, -Math.cos(L.a)*cg*B.LT, Math.sin(L.a)*cg*B.LT]);
    const ank  = add3(knee, [s*sg*B.LS, -Math.cos(sp)*cg*B.LS,  Math.sin(sp)*cg*B.LS]);
    J['hip'+i]=hip; J['knee'+i]=knee; J['ank'+i]=ank; J['toe'+i]=add3(ank, [s*.02, -.03-Math.sin(tp(i))*B.FOOT, Math.cos(tp(i))*B.FOOT]);
  });
  let up = [Math.sin(roll), Math.cos(lean)*Math.cos(roll), Math.sin(lean)];
  up = sc3(up, 1/Math.hypot(...up));
  const side = [Math.cos(roll), -Math.sin(roll), 0];
  J.base = add3(J.pelvis, sc3(up,.12));
  J.neck = add3(J.pelvis, sc3(up,B.TOR));
  const nf=q[18]||0, fwd=[0, -Math.sin(lean), Math.cos(lean)];
  J.head = add3(J.neck, sc3(add3(sc3(up, Math.cos(nf)), sc3(fwd, Math.sin(nf))), B.NECK));
  [0,1].forEach(i=>{
    const s=i?1:-1, A=arm(i), cb=Math.cos(A.b), sb=Math.sin(A.b), fp=A.a+A.e;
    const sh = add3(add3(J.neck, sc3(up,-.06)), sc3(side, s*B.SHW));
    const el = add3(sh, [s*sb*B.LU, -Math.cos(A.a)*cb*B.LU, Math.sin(A.a)*cb*B.LU]);
    J['sh'+i]=sh; J['el'+i]=el; J['hand'+i]=add3(el, [s*sb*.5*B.LF, -Math.cos(fp)*cb*B.LF, Math.sin(fp)*cb*B.LF]);
  });
  return J;
}
function worldOf(f, b){
  const s=Math.sin(f.yaw), c=Math.cos(f.yaw);
  return [f.x + c*b[0] + s*b[2], b[1], f.z - s*b[0] + c*b[2]];
}
// World ground point → body frame of someone standing at p turned by yaw: [x, z]
function bodyOf(p, yaw, w){
  const s=Math.sin(yaw), c=Math.cos(yaw), dx=w[0]-p[0], dz=w[1]-p[1];
  return [c*dx - s*dz, s*dx + c*dz];
}

// Smooth curve through keyed values (Hermite; flat at holds and turning points, so planted feet don't drift).
// keys: [time, v1, v2, …]
function spline(keys, u){
  const n=keys.length;
  if(u<=keys[0][0]) return keys[0].slice(1);

// ── Legs from foot targets: feet = [[x, h, z] left, [x, h, z] right] in the body frame,

// ── Natural gait ─────────────────────────────────────────────────────
// Each foot is on the ground for a fraction D of the stride and travels back under the body at the
// body's own speed, so planted feet never slide; then it swings through on a low arc. The same cycle
// covers running, backpedalling, side-shuffling and every diagonal in between, relative to where the
// player faces. Hips dip at mid-stance and sway over the standing leg, arms counter-swing to the legs
// running forwards and sit out wide shuffling. Stopped, it settles into the ready stance with a
// small, per-player weight shift so nobody stands frozen or moves in unison.
const STY = {
  att: { H:.9,  W:.11, lean:.14, arm:[.2,.22,.65] },    // on the ball side: tall, light on the feet
  def: { H:.85, W:.15, lean:.26, arm:[.35,.45,.95] },   // defenders: lower, arms out, ready to press
  gk:  { H:.84, W:.17, lean:.24, arm:[.45,.55,1.0] }    // keepers: set position, hands ready

function gaitQ(f, lx, lz, sp, dt, t){
  const st=styOf(f), mov=sstep(.08,.6,sp), run=sstep(.8,3.5,sp);

  f.gait += fc*dt*mov;

    const s=i?1:-1, p=frac(f.gait+(i?.5:0));
    let o, h=0;
    if(p<D) o=zf*(1-2*p/D);                                   // on the ground, moving back under the body
    else {                                                    // swing through: leaves and lands at ground speed (no jerk)
      const u=(p-D)/(1-D), m=-2*zf/D*(1-D), u2=u*u, u3=u2*u;
      o=(2*u3-3*u2+1)*-zf + (u3-2*u2+u)*m + (-2*u3+3*u2)*zf + (u3-u2)*m;
      h=hmax*Math.sin(PI*Math.pow(u,.75));

    return [s*mix(st.W, .2, lat) + lx*o, h, .02 + lz*o];

  const arm=i=>[ mix(st.arm[0], .3, lat) - amp*on[i], mix(st.arm[1], .55, lat), mix(st.arm[2], 1.3, fwd*run) ];
  const lean=st.lean + .07*fwd*run - .1*back + .06*lat + .015*Math.sin(t*1.3+f.ph)*rest;
  const roll=.03*mov*Math.sin(TAU*mid) + .02*Math.sin(t*.9+f.ph)*rest;
  return legsQ(Q(0, lean, roll, [0,0,0],[0,0,0], arm(0), arm(1), 0, 0, f.neck), H, feet);
}

// ── Passing: plant the standing foot beside the ball, swing back, strike through, follow through ──
// Times in seconds from the start of the kick. The ball leaves the foot exactly at STRIKE.
const BR = .115;
const K = { STRIKE:.52, END:1.16, KB:[.13, .32] };       // KB: ball spot (body frame x, z) for a right-foot pass
const KICK_R = [[0,.11,0,.02],[.18,.11,0,0],[.38,.15,.24,-.28],[.52,.13,.09,.11],[.7,.1,.2,.52],[1.0,.11,0,.04]];
const KICK_L = [[0,-.11,0,.02],[.09,-.13,.06,.08],[.18,-.14,0,.15],[.72,-.14,0,.15],[1.08,-.12,.05,.08],[1.16,-.11,0,.02]];

// pin (on-the-move strike): the standing foot's spot in the body frame [x, z], held on the grass
function kickQ(u, foot, pin){
  const sw=sstep(.15,.5,u)*(1-sstep(.75,1.05,u));          // through the swing
  const lean=.16+.1*Math.sin(PI*clamp((u-.3)/.5,0,1));      // body over the ball as it's struck

  const m=foot===0 ? -1 : 1, aOpp=[.3+.2*sw,.3+.45*sw,.6], aKick=[.2-.4*sw,.25+.1*sw,.6];
  const q=Q(0, lean, -.04*sw*m, [0,0,0],[0,0,0], m>0 ? aOpp : aKick, m>0 ? aKick : aOpp, 0, 0, neck);
  let L=spline(KICK_L,u); const R=spline(KICK_R,u);

// ── Keeper's save attempt (DRILL.gk): drops, lunges with the near leg towards the shot, body tilting,
//    arms reaching — then comes back up. u = seconds from the strike, s = +1 diving to the body's right.
// The body stretches long (arms beyond the head) and the whole figure tips over sideways about the
// near foot (DIVE_ROLL, applied when drawing), so it goes out flat towards the ball, lands, then gets up.
const DIVE = { load:.1, out:.2, flat:.45, up:1.35, stand:2.0 };
function diveQ(u, s){
  const D=DIVE, crouch=sstep(0,D.load,u)*(1-sstep(D.load,D.out,u)), e=sstep(D.load,D.out+.1,u)*(1-sstep(D.up,D.stand,u));

  const q=Q(0, mix(.24+.15*crouch,.0,e), 0, [0,0,0],[0,0,0], reach, reach, 0, 0, mix(.3,.1,e));

const diveRoll = u=>sstep(DIVE.out-.06, DIVE.flat, u)*(1-sstep(DIVE.up, DIVE.stand, u))*1.42;   // 0 → ~80° → 0

  for(const k in J){ const p=J[k], x=p[0]-pv[0], y=p[1]-pv[1];

// ── Receiving: body already open, the back foot (away from the passer) goes out to meet the ball
//    and cushions it back to rest in front of the body. v = seconds from the ball's arrival. ──
const CUSH = .3;

  const i=P.foot, s=i?1:-1, W0=STY.att.W;
  const ft=spline([[-.5, s*W0,0,.02],[-.1,...P.m2B],[0,...P.mB],[CUSH,...P.rB],[.62, s*W0,0,.02]], v);
  const other=[-s*W0, 0, .02];

// ╔══════════════════════════════════════════════════════════════════╗
// ║  PASS PLANNER                                                    ║

const centreOf = idx=>(DRILL.centre ? DRILL.centre(idx) : [0,0]);

// from the touch — no steps round the ball. The body only turns back towards the passer as far as

  let k=idx+1; while(PH[k] && PH[k].passer===h && !(DRILL.setUp && PH[k].shot)) k++;   // DRILL.setUp: a shot counts as the next ball         // the phase of the next pass

    return restMemo[idx] = { p:[me[0]+u[0]*REST, me[1]+u[1]*REST], at:me, yawH:y, yawK:y, foot:1, ot:false }; }
  const C=centreOf(idx), nx=PH[k];
  if(!nx || nx.restart){                                     // no pass to come: rest it in front, open to the grid
    let u=unit([C[0]-me[0], C[1]-me[1]]);
    if(inc){ const toP=unit([inc[0]-me[0], inc[1]-me[1]]); u=unit([u[0]+toP[0], u[1]+toP[1]]); }
    return restMemo[idx] = { p:[me[0]+u[0]*REST, me[1]+u[1]*REST], at:me, yawH:Math.atan2(u[0],u[1]), yawK:null, foot:1, ot:false };
  }
  const tgt = nx.shot && nx.passer===h ? W(nx.shot) : W(nx.pl[nx.passer]), pass=angTo(tgt), inY = inc ? angTo(inc) : null;

    return { foot, yawK, turn: inY==null ? 0 : Math.max(0, off-VIS), off };
  }).sort((a,b)=>(a.turn-b.turn) || (a.off-b.off))[0];
  // nx.firstTime: struck first time whatever the angle (e.g. a finish); DRILL.setUp + ph.dribble: the last
  // touch of the dribble sets the ball for the next pass, so the body is already open to it
  const ft = !!nx.firstTime && !!inc && j===idx && k===idx+1;

  const yawH = ph.open ? angTo(C) : o.turn>0 && !ft && !(DRILL.setUp && ph.dribble) ? o.yawK + Math.sign(wrap(inY-o.yawK))*o.turn : o.yawK;
  const kb=[o.foot ? K.KB[0] : -K.KB[0], K.KB[1]], s=Math.sin(o.yawK), c=Math.cos(o.yawK);

// ── One pass, timed from the start of the phase ──
// The passer is already stood at the ball: a quick pivot onto the kicking line if needed (tSet),

// A first-time pass skips the pivot: the strike lands as the ball arrives.

// ov (a pass on the move): { A, B, yawK, foot, tSet } — the strike spot and timing worked out from the run
function planPass(idx, noWait, ov){
  const prev=PH[pv(idx)], ph=PH[idx], p=prev.passer, r=ph.passer;
  const S0=restSpot(pv(idx)), R=restSpot(idx);
  const A = ov ? ov.A : S0.p, rest=R.p, dirIn=unit([rest[0]-A[0], rest[1]-A[1]]);
  const meet = R.ot ? rest : [rest[0]-dirIn[0]*.12, rest[1]-dirIn[1]*.12];

  let tSet = ov ? ov.tSet : S0.ot ? OT_K-K.STRIKE : DRILL.quick ? .05 + .22*Math.abs(wrap(S0.yawK-S0.yawH)) : .15 + .35*Math.abs(wrap(S0.yawK-S0.yawH));   // DRILL.quick: less time on the ball

  const ballDur=Math.max(.5, dist(A,meet)/ballSpeed(dist(A,meet)));

           mB:[mB[0]+sf*.16, .04, mB[1]-.07], rB:[rB[0]+sf*.16, .02, rB[1]-.07], m2B:[m2[0]+sf*.16, .06, m2[1]-.07] };   // inside of the foot against the ball
}
// ph.shot = [x, z]: the holder strikes the ball (as it lies) to that point, e.g. into a mini goal — no

// DRILL.gk: the keeper's index, or several (a goal at each end) — the one nearest the shot goes for it

             tSet:ov.tSet, tKick, tArr, tRest:tArr+CUSH, foot:ov.foot, kfoot:ov.foot, ot:false, inc:null, shot:true, onMove:true,

function segItem(a, b, wM, color, bias){
  const A=project(cam,a), P=project(cam,b);

  return { z:z+(bias||0), d:`M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${P[0].toFixed(1)} ${P[1].toFixed(1)}`,
           stroke:color, w:(wM*cam.f/z).toFixed(2) };
}
function dotItem(c, rM, color, bias){
  const C=project(cam,c);
  if(C[2]<.6) return null;
  return { z:C[2]+(bias||0), raw:C[2], d:`M${C[0].toFixed(1)} ${C[1].toFixed(1)}h.01`,
           stroke:color, w:(2*rM*cam.f/C[2]).toFixed(2) };

function polyD(pts){ return 'M'+pts.map(p=>{ const s=project(cam,p); return s[0].toFixed(1)+' '+s[1].toFixed(1); }).join('L')+'Z'; }

function coneItem(x, z){

  return { z:(P[0][2]+P[1][2])/2, fill:'#f28c1a', d:'M'+P.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z' };
}

// f.op (optional, 0–1): faded figure, e.g. players in a grid that's not in play
function figureItems(f, items){
  const J=fkF(f), s=Math.sin(f.yaw), c=Math.cos(f.yaw), tc=TEAM[f.team]||f.team;
  const Wd = b=>worldOf(f, b), op=f.op==null || f.op>.99 ? null : +f.op.toFixed(2);
  const push = it=>{ if(it){ if(op!=null) it.op=op; items.push(it); } };
  [0,1].forEach(i=>{
    const hip=Wd(J['hip'+i]), knee=Wd(J['knee'+i]), ank=Wd(J['ank'+i]), toe=Wd(J['toe'+i]);
    const midT=lerp3(hip,knee,.45), sockTop=lerp3(knee,ank,.4), waist=add3(hip,[0,.03,0]);
    push(segItem(midT, knee, .13, SKIN));
    push(segItem(waist, midT, .19, SHORTS, .04));
    push(segItem(knee, sockTop, .115, SKIN));
    push(segItem(sockTop, ank, .12, tc));
    push(segItem(ank, toe, .105, BOOT));
  });
  push(segItem(add3(Wd(J.hip0),[0,.03,0]), add3(Wd(J.hip1),[0,.03,0]), .22, SHORTS, .04));
  // Torso reads wide from the front/back, narrow side-on
  const vx=f.x-cam.pos[0], vz=f.z-cam.pos[2], vn=Math.hypot(vx,vz)||1;
  const facing=Math.abs((vx*s+vz*c)/vn);
  push(segItem(Wd(J.base), Wd(J.neck), .22+.14*facing, tc, .02));
  [0,1].forEach(i=>{
    const sh=Wd(J['sh'+i]), el=Wd(J['el'+i]), ha=Wd(J['hand'+i]), sl=lerp3(sh,el,.55);
    push(segItem(sl, el, .085, SKIN));
    push(segItem(sh, sl, .105, tc, -.001));
    push(segItem(el, ha, .08, SKIN));
  });
  const H=Wd(J.head);
  push(segItem(Wd(J.neck), H, .09, SKIN, .01));

  const hy=f.yaw+f.headTurn, hs=Math.sin(hy), hc=Math.cos(hy);
  const head=dotItem(H, .12, SKIN, -.01);
  push(head);

  [-1,1].forEach(k=>{
    const eye=dotItem([H[0]+hs*.1+hc*k*.045, H[1]+.01, H[2]+hc*.1-hs*k*.045], .022, '#111', -.03);

}

  return pool;
}
function drawItems(pool, items){
  items.sort((a,b)=>b.z-a.z);

// ║  SCENE — players, ball and timeline                              ║
// ╚══════════════════════════════════════════════════════════════════╝
// SC.ev: timed callbacks [{at, fn}] in absolute seconds (board updates when a pass lands, etc.)
const SC = { t0:0, P:null, prevP:null, prevD:0, end:0, holder:0, holdYaw:0, rest:[0,0], ev:[], ball:[0,0], roll:0, rollDir:[0,1] };
let figs = [];
function makeFigs(){
  figs = PH[0].pl.map((p,i)=>{
    const w=W(p);
    return { team:DRILL.teams[i], role:DRILL.roles[i], x:w[0], z:w[1], yaw:0, headTurn:0, neck:.2, gait:Math.random(),

  });

}

// Facing: everyone's body is open to the ball and the grid; defenders square up to the ball
function faceYaw(f, i, tt){
  const P=SC.P, b=SC.ball, ang=p=>Math.atan2(p[0]-f.x, p[1]-f.z);
  if(P && i===P.p && tt<P.tKick+.35) return P.yawK;          // opened up to the target for the pass
  if(P && i===P.r && tt<P.tRest+.5)  return P.yawR;          // body shape set before the ball arrives
  // SC.feint (ph.feint, opt-in): just after the control the holder sells a pass that way, then opens back up
  if(i===SC.holder && SC.feint && P && i===P.r && tt>P.tRest+.5 && tt<P.tRest+1.05) return ang(SC.feint);
  if(i===SC.holder) return SC.holdYaw;                       // on the ball: stays open to the next pass
  if(f.role==='att') return ang(lerp2(b, SC.centre||[0,0], .4));
  return ang(b);
}
function snapFig(f, i){
  f.vx=f.vz=0; f.moves=[]; f.start=[f.x,f.z];
  f.yaw=faceYaw(f, i, 99); f.headTurn=0;
  f.neck=.25; f.q=gaitQ(f, 0, 1, 0, 0, 0);
}

function updateFig(f, i, tt, t, dt){
  const p=posAt(f.start, f.moves, tt), vx=(p[0]-f.x)/dt, vz=(p[1]-f.z)/dt;
  f.x=p[0]; f.z=p[1];
  const k=Math.min(1, dt*12); f.vx=mix(f.vx, vx, k); f.vz=mix(f.vz, vz, k);
  const sp=Math.hypot(f.vx, f.vz);

  let ty=faceYaw(f, i, tt);
  const omP = SC.P && SC.P.onMove && i===SC.P.p;                             // on-the-move pass: opens up just before the strike
  if(SC.drib && i===SC.drib.i && sp>.4 && !(omP && tt>SC.P.tSet-.2)) ty=Math.atan2(f.vx, f.vz);       // dribbling: faces the run
  if((DRILL.setUp && SC.drib) || f.armK!=null){ const ak = DRILL.setUp && SC.drib && i===SC.drib.i && !(omP && tt>SC.P.tKick) ? .45 : 1; f.armK = mix(f.armK==null ? 1 : f.armK, ak, Math.min(1, dt*4)); }

  if(P && P.shot && i===P.gk && tt>P.tKick && tt<P.tKick+2.0){ if(P.gkYaw==null) P.gkYaw=f.yaw; f.yaw=P.gkYaw; }   // square on through the dive
  // Head and eyes: on the ball; the player on the ball scans the grid, glancing down at it now and then
  const b=SC.ball, db=Math.hypot(b[0]-f.x, b[1]-f.z), resting = i===SC.holder && !(P && tt<P.tRest+.5);
  let ht = resting ? .75*Math.sin(t*1.5+f.ph) : clamp(wrap(Math.atan2(b[0]-f.x, b[1]-f.z)-f.yaw), -1.35, 1.35);
  let nt = resting ? .28+.2*Math.max(0, Math.sin(t*2.6+f.ph)) : clamp(Math.atan2(1.5, db)-.12, .05, .55);
  // SC.look (opt-in): 'down' = head bowed, eyes on the ball the whole time; 'scan' = checks both shoulders before it arrives
  const lk = SC.look && P && i===P.r ? SC.look : null;
  if(lk==='down'){ ht=clamp(wrap(Math.atan2(b[0]-f.x, b[1]-f.z)-f.yaw), -1.35, 1.35); nt=.9; }
  else if(lk==='scan' && tt<P.tArr-.3){ const u=clamp(tt/(P.tArr-.3), 0, 1); ht=1.25*Math.sin(2*Math.PI*u); nt=.1; }
  f.headTurn += (ht-f.headTurn)*Math.min(1, dt*(lk==='scan' ? 10 : 8));
  f.neck += (nt-f.neck)*Math.min(1, dt*6);
  // Travel direction in the body frame → gait
  const s=Math.sin(f.yaw), c=Math.cos(f.yaw), n=sp||1;
  let q=gaitQ(f, (f.vx*c - f.vz*s)/n, (f.vx*s + f.vz*c)/n, sp, dt, t);
  // First touch still finishing from the phase before (the next pass started straight after it)
  const pp=SC.prevP;
  if(pp && i===pp.r && !pp.ot){
    const v=tt+SC.prevD-pp.tArr;
    if(v<.65) q=mixQ(q, recvQ(pp, v), 1-sstep(.5,.62,v));
  }
  // Kick / first touch, blended in and out
  if(P && i===P.p){
    const u=(tt-P.tSet)*(P.ks||1);                                           // P.ks: a quicker swing on the move
    if(u>-.05 && u<K.END){
      const w=sstep(0,.1,u)*(1-sstep(K.END-.12,K.END,u)), pw=P.plantW, dx=pw ? pw[0]-f.x : 0, dz=pw ? pw[1]-f.z : 0;

    }

    const u=tt-P.tKick;
    if(u>0 && u<2.2){
      if(!P.gkS) P.gkS=Math.sign(bodyOf([f.x,f.z], f.yaw, P.meet)[0])||1;    // side fixed at the strike
      q=mixQ(q, diveQ(u, P.gkS), sstep(0,.08,u)*(1-sstep(2.0,2.2,u)));
      f.dive={ s:P.gkS, a:diveRoll(u) };
    }
  }
  if(P && i===P.r && !P.ot){
    const v=tt-P.tArr;
    if(v>-.6 && v<.65){ const w=sstep(-.55,-.45,v)*(1-sstep(.5,.62,v)); q=mixQ(q, recvQ(P, v), w); }
  }

}

// Start a phase. snap: jump straight to the board (Back, Setup). Otherwise plan the pass and the
// moves; with DRILL.flow the phase carries on from wherever everyone is (runs still in progress are
// finished, not restarted, and a first-time pass meets the ball still rolling in).
// Returns the plan (null on a snap).
// ph.dribble: the holder runs with the ball. The first touch takes it from where it lies; then a touch
// every ~1.5 m pushes it just ahead and the player runs onto it; the last touch lets it roll to a stop
// in front, on the line of the run.
function buildDrib(idx, plan){
  const i=PH[idx].passer, mv=plan.moves[i], st=plan.starts[i];
  if(!mv.length) return null;
  const t0=Math.max(0, mv[0].t0), t1=mv[mv.length-1].t0+mv[mv.length-1].dur;
  const pos=t=>posAt(st, mv, t);
  const fwd=t=>{ const a=pos(Math.max(t0, t-.06)), b=pos(Math.min(t1, t+.06)), d=dist(a,b); return d>1e-3 ? [(b[0]-a[0])/d, (b[1]-a[1])/d] : null; };
  const b0=SC.ball.slice(), T=[{ t:t0, p:b0 }, { t:t0+.18, p:b0 }];
  // ph.touches===1 straight after a ball received in stride: the receiving touch IS the touch — it
  // goes from the foot at once (t 0) and the next contact is the last one, setting the next ball
  const one = PH[idx].touches===1 && PH[idx-1] && PH[idx-1].inStride;
  if(one){ T.length=0; T.push({ t:0, p:b0 }); }
  let acc=0, q=pos(t0+.18), lastU=fwd(t0+.3)||[0,1];
  for(let t=t0+.2; !one && t<t1-.35; t+=.02){
    const p=pos(t); acc+=dist(p,q); q=p;
    if(acc>=1.5){ const u=fwd(t)||lastU; lastU=u; T.push({ t, p:[p[0]+u[0]*.32, p[1]+u[1]*.32] }); acc=0; }
  }

  const nx=PH[idx+1], sets = DRILL.setUp && nx && !nx.onMove && (nx.passer!==i || nx.shot), R = sets ? restSpot(idx) : null;
  const pe=pos(t1); T.push({ t:t1, p: R ? R.p.slice() : [pe[0]+lastU[0]*.45, pe[1]+lastU[1]*.45] });
  return { i, T, end:T[T.length-1].p, yaw: R ? R.yawH : Math.atan2(lastU[0], lastU[1]) };
}
function dribAt(D, tt){
  const T=D.T;
  if(tt<=T[0].t) return T[0].p;
  for(let k=1;k<T.length;k++) if(tt<T[k].t){
    const x=(tt-T[k-1].t)/Math.max(1e-3, T[k].t-T[k-1].t);
    return lerp2(T[k-1].p, T[k].p, 1-(1-x)*(1-x));                     // quick off the foot, slowing
  }

}
function scenePhase(idx, t, snap){
  const ph=PH[idx];
  SC.centre=centreOf(idx);
  SC.look = ph.look || null;                                  // ph.look: the receiver's head as the ball comes ('down' | 'scan')
  SC.feint = ph.feint ? W(ph.feint) : null;                  // ph.feint: the body fakes a pass towards that point after the control
  if(snap || idx===0){
    figs.forEach((f,i)=>{ const w=W(ph.pl[i]); f.x=w[0]; f.z=w[1]; });
    SC.P=null; SC.prevP=null; SC.holder=ph.passer; SC.holdYaw=restSpot(idx).yawH; SC.rest=restSpot(idx).p; SC.ball=SC.rest.slice(); SC.drib=null;
    figs.forEach(snapFig);
    SC.t0=t; SC.end=0; SC.ev=[];
    return null;
  }
  const d=t-SC.t0;
  const carry = DRILL.flow ? { d, P:SC.P,
    starts: figs.map(f=>posAt(f.start, f.moves, d)),
    moves:  figs.map(f=>f.moves.filter(m=>m.t0+m.dur>d).map(m=>Object.assign({}, m, { t0:m.t0-d }))) } : null;
  if(!carry) SC.ev=[];
  const plan=planPhase(idx, carry);
  figs.forEach((f,i)=>{ f.start=plan.starts[i]; f.moves=plan.moves[i]; const p=posAt(f.start, f.moves, 0); f.x=p[0]; f.z=p[1]; });

  SC.P=plan.P; SC.holder=ph.passer; SC.holdYaw=restSpot(idx).yawH; SC.rest=restSpot(idx).p;

  if(plan.P && plan.P.drib) SC.drib=plan.P.drib;                             // (carrying it into an on-the-move pass)

}
// Seconds after the phase start that Auto may play the next pass in a flowing drill:
// straight off the first touch, or timed so a first-time strike meets the ball as it arrives.
// A phase with runs but no pass doesn't wait for long runs to finish — they carry on into the next pass.
function flowNext(idx, plan){
  if(!plan) return 0;
  if(!plan.P) return PH[idx].hold!=null ? PH[idx].hold : Math.min(plan.end, 2);   // ph.hold overrides
  return restSpot(idx).ot && idx<PH.length-1 ? plan.P.tArr-OT_K : plan.P.tRest+.05;

function sceneUpdate(t, dt){

  if(d>1e-4){ SC.rollDir=unit([nb[0]-SC.ball[0], nb[1]-SC.ball[1]]); SC.roll += d/BR; }
  SC.ball=nb.slice();
  figs.forEach((f,i)=>updateFig(f, i, tt, t, dt));

// Players (with shadows) and the ball, into the depth-sorted item list
function peopleItems(items, shadows){
  figs.forEach((f,i)=>{ figureItems(f, items); placeShadow(shadows[i], f.x, f.z, .36, f.lift); });
  const b=[SC.ball[0], BR, SC.ball[1]], u=SC.rollDir, r=SC.roll;
  placeShadow(shadows[figs.length], b[0]+.04, b[2]+.04, .13, 0);

  if(toCam(cam,pt)[2] < toCam(cam,b)[2]){ const pi=dotItem(pt, .035, '#3a3a3a', -.003); if(pi) items.push(pi); }

  desc:"The nearest Blue presses, the other two cut the lanes." },

{ label:"Orange Pass 2", score:2, holder:GR(0),
  r:R_SET, b:GB([[-4.0,-10.4],[-1.2,-12.3],[-.6,-9.2]]), g:set(G_PLAY, 0, [-6,-9.6]),
  desc:"Across the top of the Orange zone. The Blues shift with the ball." },

{ label:"Orange Pass 3", score:3, holder:GR(3),
  r:R_SET, b:GB([[-4.4,-13.2],[-2.0,-13.0],[-1.8,-10.5]]), g:set(G_PLAY, 3, [-6.2,-15]),
  desc:"Down the left side. Four passes — but the Blues are reading it now." },

{ label:"Orange Pass 4", score:4, holder:GR(4),
  r:R_SET, b:GB([[-3.3,-13.6],[-.6,-13.8],[1.8,-12.8]]), g:G_PLAY,
  desc:"Into the middle of the back line. One Blue presses, one sits in the lane to the right." },

{ label:"Blue Win It!", score:4, holder:BL(5), intercept:true,
  r:R_SET, b:GB([[-1.8,-15.0],[.2,-14.8],[3,-16.0]]), g:G_PLAY,
  desc:"The 5th pass goes right — the Blue in the lane reads it and steps in. Won." },

{ label:"Blue Score!", score:4, holder:BL(5), shot:[-2.2, -END-.3],
  r:R_SET, b:GB([[-1.8,-15.0],[.2,-14.8],[3,-16.0]]), g:G_PLAY,
  desc:"Win it, then go: one touch out of the feet and straight into the far corner of the bottom goal." },

{ label:"Full Rotation", air:true, score:0, holder:CO, restart:true, netBall:true,
  r:R_SET, b:B_ATT, g:G_ROT, via:ROT_VIA,
  desc:"Big transition. All 6 Blues take over the Orange zone as the new attackers. Orange send 3 up to defend in the Red zone; the other 3 drop into the middle." },

{ label:"Coach Restarts Into Red", air:true, score:0, holder:RD(5),
  r:set(R_SET, 5, [5.6,9.4]), b:B_ATT, g:[[-1.2,11.2],[1.2,13.2],[3.2,10.6], ...G_ROT.slice(3)],
  desc:"The coach plays a new ball into Red and the cycle starts again — now with Orange defending." }
].map(mk);

// Game-share pace: first time where the angle allows, runs carry on, keepers go for the shots.
const ORANGE = '#ff8c1a';                             // bright orange: stands out from the grass
const DRILL = { teams:[...Array(6).fill('red'), ...Array(6).fill('blue'), ...Array(6).fill(ORANGE), 'yellow', 'yellow', '#8d939c'],
                roles:[...Array(6).fill('att'), ...Array(6).fill('def'), ...Array(6).fill('att'), 'gk', 'gk', 'att'],
                oneTouch:true, flow:true, setUp:true, chain:true, gk:[18,19], quick:true, ballK:1.25, gkPush:.3,
                centre: idx=>{ const ph=PH[idx], z=W(ph.pl[ph.passer])[1]; return z>ZL ? [0,13] : z<-ZL ? [0,-13] : [0,0]; } };
/*@@END*/

// ── Scene ────────────────────────────────────────────────────────────
makeFigs();
const TAGS = [...Array(18).fill(null), 'GK', 'GK', 'Coach'];
const pool = makePool('pool', 900);
const shadows = makeShadows('shadows', figs.length+1);
const tagEls = TAGS.map(tx=>{ if(!tx) return null; const el=document.createElementNS(SVGNS,'text'); el.textContent=tx; document.getElementById('tags').appendChild(el); return el; });
const $id = id=>document.getElementById(id);
const ZONES = [quad(-HW, ZL, HW, END), quad(-HW, -ZL, HW, ZL), quad(-HW, -END, HW, -ZL)];

// Camera: k = 0 aerial … 1 framed on a zone; z = where along the pitch (follows the ball)
const CAMS = { k:0, kv:0, z:0, zv:0 };
function moveCam(dt, snap){
  const tk = PH[current].air ? 0 : 1, tz = clamp(SC.ball[1], -13, 13);
  if(snap){ CAMS.k=tk; CAMS.kv=0; CAMS.z=tz; CAMS.zv=0; }
  else {                                                                    // critically damped springs
    const wk=2.6, wz=3.2;
    CAMS.kv += (wk*wk*(tk-CAMS.k) - 2*wk*CAMS.kv)*dt; CAMS.k += CAMS.kv*dt;
    CAMS.zv += (wz*wz*(tz-CAMS.z) - 2*wz*CAMS.zv)*dt; CAMS.z += CAMS.zv*dt;
  }
  const k=clamp(CAMS.k, 0, 1), e=k*k*(3-2*k), A=CAM_AIR, Z=CAM_ZONE, z=CAMS.z;
  Object.assign(cam, lookCam({ pos:[0, mix(A.pos[1],Z.y,e), mix(A.pos[2], z-Z.back, e)], look:[0, 0, mix(A.look[2], z, e)],
                               f:mix(A.f,Z.f,e), cy:mix(A.cy,Z.cy,e) }));
}

const placeTxt = (id, p)=>{ const s=project(cam, p), el=$id(id); el.setAttribute('x', s[0].toFixed(1)); el.setAttribute('y', s[1].toFixed(1)); };
// Ground (redrawn each frame — the camera moves): stripes, the three zones, the lines
let TXT_AT = { goal:[0,3,END], won:[0,2.6,0] };
function drawGround(){
  let st='';
  for(let z=-30; z<30; z+=4) st += polyD(quad(-26, z, 26, z+2));
  $id('stripes').setAttribute('d', st);
  ['zR','zB','zG'].forEach((id,k)=>$id(id).setAttribute('d', polyD(ZONES[k])));
  const L=(a,b)=>lineD([a[0],.005,a[1]], [b[0],.005,b[1]]);
  $id('marks').setAttribute('d', polyD(quad(-HW, -END, HW, END)) + L([-HW,ZL],[HW,ZL]) + L([-HW,-ZL],[HW,-ZL]));
  placeTxt('ftGoal', TXT_AT.goal); placeTxt('ftWon', TXT_AT.won); placeTxt('ftSplit', [0, 2.6, 12]);
}
// Goals: posts, bar and a sloping net frame (s = which way the net runs)
function goalItems(items){
  GOALS.forEach(g=>{
    const L=g.x-g.w/2, R=g.x+g.w/2, z=g.z, zb=z+g.s*g.d, lo=.35, add=it=>{ if(it) items.push(it); };
    [L,R].forEach(x=>{ add(segItem([x,0,z],[x,g.h,z], .1, '#f2f2f2')); add(segItem([x,g.h,z],[x,lo,zb], .03, '#bdbdbd')); add(segItem([x,0,zb],[x,lo,zb], .03, '#bdbdbd')); });
    add(segItem([L,g.h,z],[R,g.h,z], .1, '#f2f2f2'));
    add(segItem([L,lo,zb],[R,lo,zb], .03, '#bdbdbd')); add(segItem([L,0,zb],[R,0,zb], .03, '#bdbdbd'));
    for(let k=1;k<8;k++){ const x=mix(L,R,k/8); add(segItem([x,g.h,z],[x,lo,zb], .012, 'rgba(255,255,255,0.4)')); add(segItem([x,lo,zb],[x,0,zb], .012, 'rgba(255,255,255,0.4)')); }
    for(let k=1;k<4;k++){ const y=g.h*k/4, zz=mix(zb, z, y/g.h); add(segItem([L,y,zz],[R,y,zz], .012, 'rgba(255,255,255,0.3)')); }
  });
}

// Pass arrow: one dashed arrow on the grass along the pass being played, gone once the ball arrives.
// Gold for the split.
const ARROW = (()=>{
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('opacity','0');
  const l=document.createElementNS(SVGNS,'path'), h=document.createElementNS(SVGNS,'path');
  l.setAttribute('fill','none'); l.setAttribute('stroke-dasharray','6 3');
  g.appendChild(l); g.appendChild(h); $id('trail').appendChild(g);
  return { g, l, h, P:null, col:'' };
})();
function setArrow(P, ph){
  ARROW.P = P && !P.shot ? P : null; ARROW.col = ph && ph.splitP ? '#f0a500' : 'rgba(255,255,255,0.75)';
  ARROW.g.setAttribute('opacity', ARROW.P ? '0.9' : '0');
}
function drawArrow(){
  const P=ARROW.P; if(!P) return;
  const A=P.A, Bt=P.rest, u=unit([Bt[0]-A[0], Bt[1]-A[1]]), n=[-u[1], u[0]];
  const s=[A[0]+u[0]*.35, A[1]+u[1]*.35], e=[Bt[0]-u[0]*.35, Bt[1]-u[1]*.35];
  ARROW.l.setAttribute('stroke', ARROW.col); ARROW.l.setAttribute('stroke-width', ARROW.col[0]==='#' ? '2.2' : '1.6');
  ARROW.l.setAttribute('d', lineD([s[0],.01,s[1]], [e[0]-u[0]*.2,.01,e[1]-u[1]*.2]));
  ARROW.h.setAttribute('fill', ARROW.col);
  ARROW.h.setAttribute('d', polyD([[e[0]+u[0]*.2,.01,e[1]+u[1]*.2],[e[0]-u[0]*.3+n[0]*.22,.01,e[1]-u[1]*.3+n[1]*.22],[e[0]-u[0]*.3-n[0]*.22,.01,e[1]-u[1]*.3-n[1]*.22]]));
}

// Pass counter: 7 pips (the 7th = shoot)
const pipsEl=$id('pips');
for(let i=0;i<7;i++){ const p=document.createElement('div'); p.className='pip'; p.textContent=i+1; pipsEl.appendChild(p); }
// Board once a pass has arrived: pips, the split / WON IT! flashes; the pass arrow goes.
function setBoard(idx, done){
  if(done) setArrow(null);
  const ph=PH[idx], n = done ? ph.score : Math.max(0, ph.score-1), split = done && !!ph.splitP, won = done && !!ph.intercept;
  const team = ph.holder<6 ? 'Red' : ph.holder<12 ? (ph.intercept || ph.shot ? 'Blue' : 'Orange') : ph.holder<18 ? 'Orange' : (idx>=PH.length-2 ? 'Red' : idx>=10 ? 'Orange' : 'Red');
  pipsEl.querySelectorAll('.pip').forEach((p,i)=>{
    p.classList.remove('on','split','win');
    if(i<n) p.classList.add(i===6 ? 'win' : 'on');
  });
  const sl=$id('scoreLbl');
  sl.textContent = won || (ph.shot && ph.holder>=6 && ph.holder<12) ? 'Blue won it → shoot' : n>=7 ? team+': 7 → shoot!' : team+': 7 passes, then shoot';
  sl.style.color = won ? '#1a6eb5' : n>=7 ? '#22b56e' : '#555';
  ['ftSplit'].forEach(id=>$id(id).classList.toggle('show', split));
  $id('ftWon').classList.toggle('show', won);
}

// The finished ball stays in the net while the next ball goes in
let NET_BALL=null;
// Starts a phase; returns seconds until Auto plays on.
function applyScene(idx, t, snap){
  const ph=PH[idx], prevP=SC.P, plan=scenePhase(idx, t, snap);
  NET_BALL = ph.netBall && !snap && prevP && prevP.shot ? prevP.rest.slice() : ph.netBall && snap ? W(PH[idx-1].shot) : null;
  $id('ftGoal').classList.remove('show');
  if(ph.shot) TXT_AT.goal=[0, 3.2, ph.shot[1]>0 ? END : -END];
  if(ph.intercept) TXT_AT.won=[W(ph.pl[ph.holder])[0], 2.8, W(ph.pl[ph.holder])[1]];
  if(!plan){ setBoard(idx, true); if(ph.shot) $id('ftGoal').classList.add('show'); moveCam(0, true); return 0; }
  const P=plan.P;
  if(P && P.shot){ setBoard(idx, true); SC.ev.push({ at:t+P.tArr, fn:()=>$id('ftGoal').classList.add('show') }); }
  else if(P){
    setBoard(idx, false);
    if(P.inc) SC.ev.push({ at:t+P.tKick+.001, fn:()=>setArrow(P, ph) });   // after the last pass lands
    else setArrow(P, ph);
    SC.ev.push({ at:t+P.tArr, fn:()=>setBoard(idx, true) });                // the pass counts when it arrives
  } else setBoard(idx, true);
  if(ph.restart) return ph.hold!=null ? ph.hold : Math.max(plan.end, 2.5);
  return flowNext(idx, plan);
}
function updateScene(t, dt){ sceneUpdate(t, dt); moveCam(dt, false); }

function renderScene(){
  drawGround(); drawArrow();
  const items=[];
  goalItems(items);
  peopleItems(items, shadows);
  if(NET_BALL){ const o=dotItem([NET_BALL[0], BR, NET_BALL[1]], .13, '#1b1b1b', .002), w=dotItem([NET_BALL[0], BR, NET_BALL[1]], .115, '#f4f4f4'); if(o) items.push(o); if(w) items.push(w); }
  figs.forEach((f,i)=>{
    shadows[i].setAttribute('opacity', (1-Math.min(.7, f.lift*2)).toFixed(2));
    const el=tagEls[i]; if(!el) return;
    const s=project(cam, [f.x, 2.12, f.z]); el.setAttribute('x', s[0].toFixed(1)); el.setAttribute('y', s[1].toFixed(1));
  });
  drawItems(pool, items);
}

// ╔══════════════════════════════════════════════════════════════════╗
// ║  UI                                                              ║
// ╚══════════════════════════════════════════════════════════════════╝
let current=0, isAuto=false, timer=null;
const now = ()=>performance.now()/1000;
function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function applyPhase(idx, snap){
  const ph=PH[idx];
  const dur=applyScene(idx, now(), snap);
  document.getElementById('badge').textContent=ph.label.replace(' — ',' · ');
  document.getElementById('desc').textContent=ph.desc;
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===PH.length-1 ? '0.3':'1';
  return dur;
}

// Forward plays the pass and the movement; Back jumps straight to the earlier board.
// Next pressed while the ball is still travelling: settle that board first, then play on.
function changePhase(dir){
  const next=clamp(current+dir, 0, PH.length-1);
  if(next===current) return;
  if(dir>0 && SC.P && now()<SC.t0+SC.P.tRest) applyScene(current, now(), true);
  current=next;
  applyPhase(current, dir<0);
}

// Auto: one flowing rondo — each pass is played straight off the first touch (or first time),
// while the others are still moving (setup holds 2.5 s)
function scheduleNext(wait){
  timer=setTimeout(()=>{
    if(current<PH.length-1){ current++; scheduleNext(applyPhase(current)); }
    else stopAuto();
  }, (wait>0 ? wait : 2.5)*1000);
}
function toggleAuto(){
  if(isAuto){ stopAuto(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===PH.length-1){ current=0; applyPhase(0, true); }
  scheduleNext(0);
}
function stopAuto(){
  isAuto=false; clearTimeout(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

let last=now();
function frame(){
  const t=now(), dt=clamp(t-last, 1/240, .05); last=t;
  updateScene(t, dt); renderScene();
  requestAnimationFrame(frame);
}

PH.forEach(()=>{ const d=document.createElement('div'); d.className='step-dot'; document.getElementById('stepDots').appendChild(d); });
applyPhase(0, true);
requestAnimationFrame(frame);
</script>
